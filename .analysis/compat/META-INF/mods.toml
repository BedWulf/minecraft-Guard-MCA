[[mods]]
modId="mcamobcompat"
version="0.2.1+1.20.1"
displayName="MCA: Mob Compatibility"
authors="otectus"
description='''Semantic entity classification that teaches Minecraft Comes Alive: Reborn to recognise modded animals, mounts, livestock and guards -- and stops Guard Villagers destroying MCA villagers.'''

# MCA: Mob Compatibility is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities and registries are present.
[[dependencies.mcamobcompat]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.mcamobcompat]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
[[dependencies.mcamobcompat]]
    modId="mca"
    mandatory=true
    versionRange="[7.6,8)"
    ordering="AFTER"
    side="BOTH"
# Architectury is deliberately NOT declared. This mod names no Architectury type (its build only puts
# Architectury on the dev runtime classpath because MCA 7.6 needs it there), and MCA Reborn declares
# its own dependency on it. A redundant mandatory=true edge here would refuse to load on any future
# MCA that stops needing Architectury -- which MCA 7.7 already does.

# Every entry below is OPTIONAL, and every version range is deliberately "[0,)" (= any version).
#
# "[0,)" rather than a tested floor because Forge enforces an optional dependency's versionRange when
# the mod IS present: a floor would refuse to launch for someone running an older build, for a mod we
# only ever touch through registry ids and datapack tags. There is nothing to be incompatible with --
# no class of theirs is referenced anywhere in this jar -- so the correct range is "any", and any
# genuine incompatibility is handled in Java by simply not classifying an entity.
#
# It must NOT be an empty string: Maven parses "" into a range with no restrictions, which contains
# no version at all, so Forge reports "only supports <mod>" the moment that mod is installed.
#
# ordering="AFTER" so their entity types and tags are registered before our setup runs.

# Guard Villagers. The reason this mod exists: its villager->guard conversion reaches MCA villagers
# and destroys their family/marriage/genetics data (see ConversionGuardHandler).
[[dependencies.mcamobcompat]]
    modId="guardvillagers"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# SWEM (Star Worm Equestrian Mod) -- swem:swem_horse, classified as horse + mount.
[[dependencies.mcamobcompat]]
    modId="swem"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Genetic Animals. Note the mod id is "eanimod", NOT "geneticanimals": the jar's own mods.toml
# declares modId="eanimod" and its package root is mokiyoki.enhancedanimals. Its entities are
# eanimod:enhanced_cow, enhanced_pig, enhanced_sheep, and so on.
[[dependencies.mcamobcompat]]
    modId="eanimod"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# DragN's Livestock Overhaul -- the "O-Animals" (dragnlivestock:o_cow, o_pig, ...). DLO already
# registers its animals into the Forge conventional entity-type tags, so most of our classification
# of it comes free through those.
[[dependencies.mcamobcompat]]
    modId="dragnlivestock"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.mcamobcompat]]
    modId="icys_better_horses"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.mcamobcompat]]
    modId="alexsmobs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
