buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
    }
}

plugins {
    id 'java-library'
}

apply plugin: 'net.minecraftforge.gradle'

version = "${minecraft_version}-${mod_version}"
group = 'com.github.bedwulf.mcaguardappearance'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Guard Villagers — compileOnly: нужен только для типов Guard/GuardEntityType,
    // в выходной JAR не попадает (TASK: не включать чужие JAR).
    compileOnly files('mods-for-analysis/guardvillagers-1.20.1-1.6.10.jar')
}

minecraft {
    mappings channel = "${mappings_channel}".toString(), version = "${mappings_version}".toString()
    copyIdeResources = true
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "mcaguardappearance",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
